<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BERLIN — 1237 · Fig. 05</title>
<link rel="stylesheet" href="assets/posters.css">
<style>
.p05 { --ground: var(--signal); padding: 48px; display: flex; flex-direction: column; gap: 16px; }
.p05 .word { font-size: 52px; font-weight: 500; line-height: 1; }
.p05 .rule { height: 1px; background: var(--ink); }
.p05 .digits { display: flex; flex-direction: column; margin-right: -120px; margin-top: 12px; }
.p05 .digits span { font-size: 450px; font-weight: 700; line-height: 0.78; letter-spacing: -0.06em; }
.p05 .spec { grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: auto; font-family: var(--font-mono); }
.p05 .spec > div { padding-top: 12px; }
.p05 .spec .text { font-size: 12px; line-height: 1.4; }
</style>
</head>
<body>
<main class="poster p05">

  <div class="row word" aria-label="Berlin">
    <span>B</span><span>E</span><span>R</span><span>L</span><span>I</span><span>N</span>
  </div>
  <div class="rule"></div>
  <div class="row label" style="letter-spacing: 0.22em">
    <span>FIG. 05 — FOUNDING YEAR</span>
    <span>EST.</span>
  </div>

  <div class="digits" aria-label="1237">
    <span>12</span>
    <span>37</span>
  </div>

  <div class="spec">
    <div><span class="label">1237</span><span class="text">Cölln first recorded</span></div>
    <div><span class="label">1244</span><span class="text">Berlin first recorded</span></div>
    <div><span class="label">2037</span><span class="text">800 years</span></div>
  </div>

  <div class="row label" style="padding-top: 8px">
    <span>52° 31′ N — 13° 24′ E</span>
    <span>TRAVEL2BERLIN.COM</span>
  </div>

</main>
</body>
</html>
