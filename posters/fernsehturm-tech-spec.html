.p01 { --accent: var(--signal); --ground: var(--stone); padding: 48px; display: flex; flex-direction: column; gap: 14px; }

.p01 .spec { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.p01 .spec .value { font-size: 26px; font-weight: 500; letter-spacing: -0.01em; }
.p01 .foot { margin-top: auto; border-top: 1px solid var(--ink); padding-top: 10px; text-transform: uppercase; }
